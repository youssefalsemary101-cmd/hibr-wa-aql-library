
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5F9F6">
  <title>حبر وعقل | المكتبة التعليمية</title>
  <link rel="stylesheet" href="style.css?v=9">

  <script>
    try {
      if (localStorage.getItem("hibr-theme") === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
    } catch (error) {}
  </script>
</head>

<body>

  <header>
    <div class="container header-content">

      <a href="index.html" class="logo">حبر وعقل</a>

      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-label="تغيير الوضع"
        title="تغيير الوضع"
      >
        🌙
      </button>

    </div>
  </header>

  <main>

    <!-- الشاشة الرئيسية -->
    <section id="home" class="container main-section">

      <div class="home-content">

        <div class="home-icon">📚</div>

        <h1 class="section-title">
          أهلاً بك في <span>حبر وعقل</span>
        </h1>

        <p class="section-description">
          مكتبتك التعليمية تجمع الكتب الدراسية في مكان واحد.
          اختر مرحلتك وصفك ومادتك للوصول إلى الكتاب الذي تبحث عنه.
        </p>

        <a
          href="#library"
          id="browse-books"
          class="primary-button"
        >
          تصفح الكتب
        </a>

      </div>

    </section>

    <!-- المكتبة التعليمية -->
    <section class="main-section container" id="library" hidden>

      <div id="wizard">

        <div class="wizard-progress">

          <p id="step-counter">الخطوة 1</p>

          <div class="progress-track">
            <div id="progress-fill"></div>
          </div>

        </div>

        <div id="wizard-content">

          <h1 class="section-title">اختر المرحلة الدراسية</h1>

          <p class="section-description">
            حدد المرحلة التعليمية للبدء.
          </p>

        </div>

        <div class="wizard-controls">

          <button
            type="button"
            id="wizard-back"
            class="secondary-button"
            hidden
          >
            السابق
          </button>

          <button
            type="button"
            id="wizard-next"
            class="primary-button"
            disabled
          >
            التالي
          </button>

        </div>

      </div>

      <!-- البحث عن الكتب -->
      <div id="book-search-area" hidden>

        <h2 class="section-title">ابحث عن كتاب</h2>

        <input
          type="search"
          id="book-search"
          placeholder="ابحث باسم الكتاب أو المادة..."
        >

        <div id="search-results" class="books-grid"></div>

      </div>

      <div id="latest-books-container" hidden></div>

    </section>

  </main>

  <footer>
    © حبر وعقل - جميع الحقوق محفوظة
  </footer>

  <!-- ملفات الموقع -->
  <script src="curriculum.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-client.js?v=1"></script>

  <script src="books.js"></script>

  <script src="script.js?v=4"></script>

  <!-- الشاشة الرئيسية -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const browseButton = document.getElementById("browse-books");
      const home = document.getElementById("home");
      const library = document.getElementById("library");

      if (browseButton && home && library) {

        browseButton.addEventListener("click", function (event) {

          event.preventDefault();

          home.hidden = true;
          library.hidden = false;

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        });

      }

    });
  </script>

  <!-- الوضع الفاتح والداكن -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const themeButton = document.getElementById("theme-toggle");

      if (!themeButton) return;

      function applyTheme(theme) {

        document.documentElement.classList.toggle(
          "dark-mode",
          theme === "dark"
        );

        document.body.classList.toggle(
          "dark-mode",
          theme === "dark"
        );

        themeButton.textContent =
          theme === "dark" ? "☀️" : "🌙";

        themeButton.setAttribute(
          "aria-label",
          theme === "dark" ? "تفعيل الوضع الفاتح" : "تفعيل الوضع الداكن"
        );

        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            "content",
            theme === "dark" ? "#101A16" : "#F5F9F6"
          );

      }

      let savedTheme = "light";

      try {
        savedTheme = localStorage.getItem("hibr-theme") || "light";
      } catch (error) {}

      applyTheme(savedTheme);

      themeButton.addEventListener("click", function () {

        const nextTheme =
          document.documentElement.classList.contains("dark-mode")
            ? "light"
            : "dark";

        try {
          localStorage.setItem("hibr-theme", nextTheme);
        } catch (error) {}

        applyTheme(nextTheme);

      });

    });
  </script>

</body>
</html>
