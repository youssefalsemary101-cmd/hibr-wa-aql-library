
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#248B52">
  <title>حبر وعقل | المكتبة التعليمية</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

  <header>
    <div class="container header-content">
      <a href="index.html" class="logo">حبر وعقل</a>
    </div>
  </header>

  <main>
    <section class="main-section container" id="library">

      <div id="wizard">

        <div class="wizard-progress">
          <p id="step-counter">الخطوة 1 من 5</p>
          <div class="progress-track">
            <div id="progress-fill"></div>
          </div>
        </div>

        <div id="wizard-content">
          <h1 class="section-title">مرحبًا بك في حبر وعقل</h1>
          <p class="section-description">
            اختر المرحلة الدراسية للبدء.
          </p>
        </div>

        <div class="wizard-controls">
          <button
            type="button"
            id="wizard-back"
            class="secondary-button"
            hidden
          >
            السابق
          </button>

          <button
            type="button"
            id="wizard-next"
            class="primary-button"
            disabled
          >
            التالي
          </button>
        </div>

      </div>

      <div id="book-search-area" hidden>
        <h2 class="section-title">ابحث عن كتاب</h2>
        <input
          type="search"
          id="book-search"
          placeholder="ابحث باسم الكتاب أو المادة..."
        >
        <div id="search-results" class="books-grid"></div>
      </div>

      <div id="latest-books-container" hidden></div>

    </section>
  </main>

  <footer>
    © حبر وعقل - جميع الحقوق محفوظة
  </footer>

  <script src="curriculum.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=1"></script>
  <script src="books.js"></script>
  <script src="script.js?v=2"></script>

</body>
</html>
